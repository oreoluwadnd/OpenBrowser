[project]
name = "openbrowser"
version = "0.1.0"
description = "Open-source persistent browser runtime any AI agent can drive via MCP. Log in once, stay logged in."
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.63",
    "mcp>=2.3",
    "cryptography>=50",
    "fastapi>=0.143.0",
    "websockets>=17.2",
]

[project.scripts]
openbrowser = "openbrowser.cli:main"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

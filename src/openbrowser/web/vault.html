<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenBrowser vault</title>
<style>
  body { margin: 0; padding: 12px 16px; font: 14px system-ui, sans-serif; background: #fff; color: #18181b; max-width: 40rem; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.note { color: #52525b; margin: 0 0 12px; }
  ul { padding: 0; list-style: none; }
  li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid #e4e4e7; }
  label { display: block; margin: 8px 0 2px; }
  input { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #a1a1aa; border-radius: 6px; }
  .row { display: flex; gap: 8px; } .row input:first-child { flex: 0 0 35%; }
  button { padding: 6px 12px; border: 1px solid #a1a1aa; border-radius: 6px; background: #fff; cursor: pointer; margin-top: 8px; }
  #msg { margin-top: 8px; } .err { color: #b00; }
  [hidden] { display: none !important; }
  @media (prefers-color-scheme: dark) { body { background: #18181b; color: #f4f4f5; } input, button { background: #27272a; color: #f4f4f5; } p.note { color: #a1a1aa; } li { border-color: #3f3f46; } }
</style></head>
<body>
<h1>Vault</h1>
<p class="note">Logins the agent can type into their own site but never read. Saved values are never shown again.</p>
<form id="login" hidden>
  <label>OpenBrowser API key <input id="apikey" type="password" required></label>
  <button>Open vault</button>
</form>
<div id="main" hidden>
  <ul id="entries"></ul>
  <form id="edit">
    <label>Name <input id="name" placeholder="github" required pattern="[a-z0-9][a-z0-9_-]*"></label>
    <label>Site <input id="site" placeholder="github.com" required></label>
    <div id="fields"></div>
    <button type="button" id="addfield">Add field</button>
    <button>Save</button>
  </form>
</div>
<div id="msg"></div>
<script>/*BRIDGE*/</script>
<script>
const $ = (id) => document.getElementById(id);
let apiKey = "";

// One interface, two transports: tools in the chat, the REST API in a normal browser tab.
const store = bridge.inApp && !location.pathname.startsWith("/vault") ? {
  async list() { return parse(bridge.text(await bridge.callTool("vault", {}))); },
  async save(name, site, fields) { await check(bridge.callTool("vault_save", { name, site, fields })); },
  async remove(name) { await check(bridge.callTool("vault_delete", { name })); },
} : {
  async list() { return (await api("GET", "")).json(); },
  async save(name, site, fields) { await api("PUT", "/" + name, { site, fields }); },
  async remove(name) { await api("DELETE", "/" + name); },
};

async function check(promise) {
  const result = await promise;
  if (result.isError) throw new Error(bridge.text(result));
}
async function api(method, path, body) {
  const res = await fetch("/api/vault" + path, {
    method, headers: { Authorization: "Bearer " + apiKey, "Content-Type": "application/json" },
    body: body && JSON.stringify(body),
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res;
}
function parse(text) {
  return text.split("\n").map((l) => l.match(/^- (\S+) \(([^)]+)\): (.*)$/)).filter(Boolean)
    .map((m) => ({ name: m[1], site: m[2], fields: m[3].split(", ") }));
}

function fieldRow(name = "") {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = '<input placeholder="field (email, password)" pattern="[a-z0-9][a-z0-9_-]*"><input type="password" placeholder="value (blank keeps the old one)">';
  row.firstChild.value = name;
  $("fields").append(row);
}
function show(text, error) { $("msg").textContent = text; $("msg").className = error ? "err" : ""; }

async function refresh() {
  const entries = await store.list();
  $("entries").replaceChildren(...entries.map((e) => {
    const li = document.createElement("li");
    li.innerHTML = `<span><b></b> · <span></span> · <span></span></span><span><button>Edit</button> <button>Delete</button></span>`;
    const [b, site, fields] = li.querySelectorAll("b, span > span");
    b.textContent = e.name; site.textContent = e.site; fields.textContent = e.fields.join(", ");
    const [edit, del] = li.querySelectorAll("button");
    edit.onclick = () => { $("name").value = e.name; $("site").value = e.site; $("fields").replaceChildren(); e.fields.forEach(fieldRow); };
    del.onclick = async () => { if (confirm(`Delete ${e.name}?`)) { await store.remove(e.name); refresh(); } };
    return li;
  }));
  if (!entries.length) $("entries").innerHTML = "<li>No logins saved yet.</li>";
}

$("addfield").onclick = () => fieldRow();
$("edit").onsubmit = async (event) => {
  event.preventDefault();
  const fields = {};
  for (const row of $("fields").children) {
    const [k, v] = row.querySelectorAll("input");
    if (k.value) fields[k.value] = v.value;
  }
  try {
    await store.save($("name").value, $("site").value, fields);
    $("edit").reset(); $("fields").replaceChildren(); fieldRow("email"); fieldRow("password");
    show("Saved."); refresh();
  } catch (e) { show(e.message, true); }
};

async function open() {
  $("main").hidden = false; fieldRow("email"); fieldRow("password");
  try { await refresh(); } catch (e) { show(e.message, true); }
}
if (bridge.inApp && !location.pathname.startsWith("/vault")) {
  bridge.start().then(open);
} else {
  $("login").hidden = false;
  $("login").onsubmit = (event) => { event.preventDefault(); apiKey = $("apikey").value; $("login").hidden = true; open(); };
}
</script>
</body></html>
